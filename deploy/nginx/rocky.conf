# Nginx site for R.O.C.K.Y. on the EC2 instance (ADR-004: one domain, path-based routing).
#
# HTTPS on 443 for rocky-social.duckdns.org; port 80 only redirects to HTTPS (#15).
#
# The lines marked "# managed by Certbot" were written by `certbot --nginx` (docs/deployment.md,
# section 16.6) and are kept exactly as certbot wrote them. The certificate paths point to
# /etc/letsencrypt/live/, so this file only works on a server where that certificate exists.
# Automatic renewal (certbot.timer) replaces the certificate files and does not edit this file.
#
# First install (on the server, after the certificate has been obtained):
#   sudo cp deploy/nginx/rocky.conf /etc/nginx/sites-available/rocky
#   sudo ln -s /etc/nginx/sites-available/rocky /etc/nginx/sites-enabled/rocky
#   sudo rm /etc/nginx/sites-enabled/default    # it also claims default_server on port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Apply a changed version (sites-available holds a copy, not a link, so git pull alone does
# not change Nginx):
#   sudo cp deploy/nginx/rocky.conf /etc/nginx/sites-available/rocky
#   sudo nginx -t && sudo systemctl reload nginx

# HTTPS server: serves the API and the frontend.
server {
    # The public domain. certbot reads it to know which certificate to request and which
    # server block to extend with TLS.
    server_name rocky-social.duckdns.org;

    # Do not advertise the Nginx version in error pages and the Server header.
    server_tokens off;

    # HSTS: browsers that have seen this header use only HTTPS for this domain (and its
    # subdomains) for one year, even if a link or typed URL says http://. This is safe here
    # because HTTPS works on this domain, certbot.timer renews the certificate automatically
    # (docs/deployment.md, 16.7), and port 80 only redirects. Removing HTTPS later would lock
    # out returning visitors until max-age expires, so it must stay enabled.
    # No `preload`: getting off the browsers' built-in preload list is slow and hard, and
    # duckdns.org is a shared parent domain we do not control.
    # `always`: also send the header on 4xx/5xx responses, not only 2xx/3xx.
    # Only this server sets it, because browsers ignore HSTS on plain HTTP responses.
    # Nginx inheritance: a location that sets its own add_header drops every server-level
    # add_header, so such a location would have to repeat this line.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # FR-POST-02: videos may be up to 25 MB. 30 MB leaves room for the multipart
    # boundaries and form fields; anything larger is rejected here with 413 before it
    # reaches the API.
    client_max_body_size 30m;

    # NestJS API. The API's global prefix is /api/v1, so the path is forwarded unchanged.
    location /api/ {
        # No URI after the port: Nginx passes the original path (/api/v1/...) as is.
        proxy_pass http://127.0.0.1:4000;

        # HTTP/1.1 with an empty Connection header lets Nginx reuse connections to the API.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the first hop, so the header is overwritten with the real client address
        # instead of appended to. A client-supplied X-Forwarded-For never reaches the API,
        # and with trust proxy = loopback the per-IP rate limits cannot be dodged (ADR-012).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API is on the same host: if it does not accept a connection within 5 s it is
        # down, so fail fast with 502/504. 60 s for sending and reading covers slow uploads
        # and the slowest normal responses.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js frontend (rocky-web, `next start` under PM2). Every path that is not /api/
    # goes here: pages, /_next/ assets, images and the favicon.
    location / {
        # No URI after the port: the original path and query string are passed unchanged.
        # 127.0.0.1 rather than localhost, which can resolve to ::1 where nothing listens.
        proxy_pass http://127.0.0.1:3000;

        # HTTP/1.1 with an empty Connection header lets Nginx reuse connections to Next.js
        # instead of opening a new one for every page and asset.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The original Host, so Next.js builds absolute URLs and redirects for the public
        # domain rather than for 127.0.0.1:3000.
        proxy_set_header Host $host;
        # The client address, for Next.js logs.
        proxy_set_header X-Real-IP $remote_addr;
        # Overwritten, not appended to, for the same reason as /api/: Nginx is the first hop,
        # so a client-supplied value is never trusted downstream.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Always https in this server, so Next.js knows the original request was secure.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming: the App Router sends a page in chunks (loading.tsx / Suspense), but Nginx
        # buffers proxied responses by default and would send them only when complete. The
        # Next.js self-hosting guide ("Streaming and Suspense") says to disable buffering; it
        # does this with an `X-Accel-Buffering: no` header from next.config. Turning buffering
        # off here has the same effect without changing rocky-web. The cost is small because
        # Next.js runs on the same host. /api/ keeps buffering because the API does not stream.
        proxy_buffering off;

        # Next.js runs on the same host: 5 s to connect means it is down, so fail fast with
        # 502/504. 60 s for sending and reading covers the slowest server-rendered page,
        # including its calls to the API.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # TLS, added by certbot: port 443 on IPv6 and IPv4, the Let's Encrypt certificate and
    # key, certbot's recommended TLS settings (protocols, ciphers, session cache) and DH
    # parameters. This is the only server on 443, so it is also the default for HTTPS
    # requests by bare IP; those get a certificate mismatch, because the certificate is for
    # the domain only.
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rocky-social.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rocky-social.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


# HTTP server: redirects to HTTPS and serves nothing else. Port 80 stays open because
# Let's Encrypt validates the domain over it when the certificate is renewed.
server {
    # Do not advertise the Nginx version on the redirect and 404 responses either.
    server_tokens off;

    # Requests for the domain get a permanent redirect to the same path over HTTPS.
    if ($host = rocky-social.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    # default_server on IPv4 and IPv6: requests whose Host header matches no server_name
    # (e.g. a request by bare IP) also end up here and get the 404 below. The site is only
    # served over HTTPS for the domain.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rocky-social.duckdns.org;
    return 404; # managed by Certbot


}
